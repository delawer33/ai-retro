[project]
name = "ai-retro"
version = "0.1.0"
description = "Анализ сессий Claude Code и поиск повторяющихся паттернов"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
ai-retro = "ai_retro.cli:app"

[dependency-groups]
dev = [
    # ruff >= 0.16: the default rule set grew from ~60 to ~400 rules (B, UP, SIM, C4,
    # RUF, PL subset, ASYNC, ...). Config below extends those defaults instead of
    # re-listing them.
    "ruff>=0.16",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_retro"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "I",    # isort
    "PTH",  # pathlib over os.path
    "TC",   # type-checking-only imports
    "RET",  # return consistency
    "ISC",  # implicit string concatenation
    "TID",  # tidy imports (no relative parent imports)
    "PT",   # pytest style
    "ARG",  # unused arguments
]
# Prose in this repo may be Cyrillic; those are not "ambiguous unicode" characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
